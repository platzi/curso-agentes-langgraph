[project]
name = "my-course-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.3.9",
    "fastapi[standard]>=0.117.1",
    "jinja2>=3.1.6",
    "langchain==1.2.7",
    "langchain-anthropic==1.3.1",
    "langchain-openai==1.1.7",
    "langgraph==1.0.7",
    "langgraph-api==0.7.13",
    "langgraph-checkpoint-postgres==3.0.3",
    "tavily-python==0.7.20",
]

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "ipykernel>=6.30.1",
    "langgraph-cli[inmem]==0.4.12",
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
